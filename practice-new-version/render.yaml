services:
  - type: web
    runtime: docker
    name: ai-email-assistant-agent
    rootDir: agent
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: true
      - key: LANGSMITH_PROJECT
        value: ai-email-assistant
